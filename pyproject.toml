[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curto-circuito"
version = "0.1.0"
description = "Cálculo de correntes de curto-circuito em instalações MT/BT (IEC 60909)"
requires-python = ">=3.11"
dependencies = [
    "PyQt6>=6.6",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "reportlab>=4.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-qt>=4.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
